plugins:
  - naylence-runtime

node:
  type: Node
  id: ts-fabric-client
  hasParent: true
  requestedLogicals:
    - fame.fabric
  security:
    type: SecurityProfile
    profile: open
  delivery:
    type: DeliveryProfile
    profile: at-most-once
  admission:
    type: DirectAdmissionClient
    connectionGrants:
      - type: WebSocketConnectionGrant
        purpose: node.attach
        url: ws://127.0.0.1:28000/fame/v1/attach/ws/downstream
        auth:
          type: NoAuth
    ttlSec: 60
